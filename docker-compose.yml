services:
  llm-learning:
    build: .
    container_name: llm-engineering-learning
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      LLM_LEARNING_DATA_DIR: /data
      LLM_ALLOW_REGISTRATION: ${LLM_ALLOW_REGISTRATION:-1}
      LLM_SESSION_DAYS: ${LLM_SESSION_DAYS:-30}
      LLM_COOKIE_SECURE: ${LLM_COOKIE_SECURE:-0}
      LLM_ALLOWED_HOSTS: ${LLM_ALLOWED_HOSTS:-}
      LLM_AUTO_BACKUP: ${LLM_AUTO_BACKUP:-1}
      LLM_AUTO_BACKUP_HOURS: ${LLM_AUTO_BACKUP_HOURS:-24}
      LLM_AUTO_BACKUP_KEEP: ${LLM_AUTO_BACKUP_KEEP:-10}
      LLM_RESTORE_MAX_MB: ${LLM_RESTORE_MAX_MB:-50}
    volumes:
      - llm-learning-data:/data
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  llm-learning-data:
    name: llm-engineering-learning-data
