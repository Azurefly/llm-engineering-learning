services:
  llm-learning:
    build: .
    container_name: llm-engineering-learning
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      LLM_LEARNING_DATA_DIR: /data
    volumes:
      - ./data:/data:rw
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
