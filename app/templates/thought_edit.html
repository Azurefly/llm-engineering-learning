{% extends "base.html" %}{% block title %}{{ t('add_thought') }} · {{ t('app_name') }}{% endblock %}{% block content %}<div class="editor-page"><div class="page-head"><div><div class="eyebrow">THOUGHT</div><h1>{{ t('add_thought') }}</h1><p>{{ t('markdown_hint') }}</p></div></div><form method="post" action="/thoughts/save" class="editor-form"><input type="hidden" name="item_id" value="{{ item.id or '' }}"><div class="form-grid"><label>{{ t('title') }}<input name="title" required value="{{ item.title }}" autofocus></label><label>{{ t('related_lesson') }}<select name="lesson_key"><option value="">{{ t('unassigned') }}</option>{% for lesson in lessons %}<option value="{{ lesson.key }}" {% if item.lesson_key==lesson.key %}selected{% endif %}>Week {{ lesson.week }} · {{ lesson.title }}</option>{% endfor %}</select></label></div><label>{{ t('tags') }}<input name="tags" value="{{ item.tags }}" placeholder="RAG, Agent, question"></label><label>{{ t('content') }}<textarea name="content" rows="24" placeholder="# Markdown">{{ item.content }}</textarea></label><div class="editor-actions"><a class="btn" href="/thoughts">{{ t('cancel') }}</a><button class="btn btn-primary" type="submit">{{ t('save') }}</button></div></form></div>{% endblock %}
