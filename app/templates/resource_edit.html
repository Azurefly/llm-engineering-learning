{% extends "base.html" %}{% block title %}{{ t('add_resource') }} · {{ t('app_name') }}{% endblock %}{% block content %}<div class="editor-page"><div class="page-head"><div><div class="eyebrow">EXTERNAL RESOURCE</div><h1>{{ t('add_resource') }}</h1><p>{{ '录入你认为值得反复查阅的外部资料。' if lang != 'en' else 'Capture external material worth revisiting.' }}</p></div></div><form method="post" action="/resources/save" class="editor-form"><input type="hidden" name="item_id" value="{{ item.id or '' }}"><div class="form-grid"><label>{{ t('title') }}<input name="title" required value="{{ item.title }}" autofocus></label><label>{{ t('related_lesson') }}<select name="lesson_key"><option value="">{{ t('unassigned') }}</option>{% for lesson in lessons %}<option value="{{ lesson.key }}" {% if item.lesson_key==lesson.key %}selected{% endif %}>Week {{ lesson.week }} · {{ lesson.title }}</option>{% endfor %}</select></label></div><label>{{ t('url') }}<input name="url" type="url" required value="{{ item.url }}" placeholder="https://..."></label><label>{{ t('tags') }}<input name="tags" value="{{ item.tags }}" placeholder="paper, RAG, official"></label><label>{{ t('description') }}<textarea name="description" rows="10">{{ item.description }}</textarea></label><div class="editor-actions"><a class="btn" href="/resources">{{ t('cancel') }}</a><button class="btn btn-primary" type="submit">{{ t('save') }}</button></div></form></div>{% endblock %}
