name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Install verified dependencies
        run: pip install -r requirements-dev.lock.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run tests
        env:
          PYTHONPATH: .
          LLM_CODE_RUNNER: disabled
        run: pytest -q

  sandbox-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build sandbox image
        run: docker build -t llm-learning-sandbox:py312 sandbox
      - name: Run sandbox grading smoke test
        env:
          PYTHONPATH: .
          LLM_CODE_RUNNER: docker
          LLM_CODE_RUNNER_IMAGE: llm-learning-sandbox:py312
        run: python scripts/sandbox_smoke.py

  app-docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Start hardened application
        run: docker compose up -d --build
      - name: Wait for healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Register smoke superadmin
        run: |
          curl -fsS -c cookies.txt -b cookies.txt -X POST http://127.0.0.1:8765/register \
            --data-urlencode 'username=ciuser' \
            --data-urlencode 'display_name=CI User' \
            --data-urlencode 'password=ci-password-123' \
            --data-urlencode 'password_confirm=ci-password-123' \
            -o /dev/null
          curl -fsS -b cookies.txt http://127.0.0.1:8765/admin/users | grep -q 'SUPERADMIN'
      - name: Smoke authenticated feature routes
        run: |
          curl -fsS -b cookies.txt http://127.0.0.1:8765/ | grep -q '考试中心\|Exam Center'
          curl -fsS -b cookies.txt http://127.0.0.1:8765/adaptive >/dev/null
          curl -fsS -b cookies.txt http://127.0.0.1:8765/adaptive-test >/dev/null
          curl -fsS -b cookies.txt 'http://127.0.0.1:8765/search?q=Transformer' >/dev/null
          curl -fsS -b cookies.txt http://127.0.0.1:8765/api/diagnostics >/dev/null
          curl -fsS -b cookies.txt http://127.0.0.1:8765/account >/dev/null
      - name: Verify user SQLite and session persistence across container restart
        run: |
          curl -fsS -b cookies.txt -X POST http://127.0.0.1:8765/thoughts/save \
            --data-urlencode 'title=CI Docker persistence probe' \
            --data-urlencode 'content=multi-user-persistence-987654' \
            --data-urlencode 'tags=ci' \
            --data-urlencode 'lesson_key=week01' \
            -o /dev/null
          docker compose restart llm-learning
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS -b cookies.txt 'http://127.0.0.1:8765/search?q=multi-user-persistence-987654' | grep -q 'CI Docker persistence probe'
          curl -fsS -b cookies.txt http://127.0.0.1:8765/admin/users | grep -q 'SUPERADMIN'
      - name: Verify second user isolation and admin denial
        run: |
          curl -fsS -c cookies2.txt -b cookies2.txt -X POST http://127.0.0.1:8765/register \
            --data-urlencode 'username=ciuser2' \
            --data-urlencode 'display_name=CI User 2' \
            --data-urlencode 'password=ci2-password-123' \
            --data-urlencode 'password_confirm=ci2-password-123' \
            -o /dev/null
          if curl -fsS -b cookies2.txt 'http://127.0.0.1:8765/search?q=multi-user-persistence-987654' | grep -q 'CI Docker persistence probe'; then
            echo 'Cross-user data leak detected'
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -b cookies2.txt http://127.0.0.1:8765/admin/users)
          test "$status" = "403"
          curl -fsS -b cookies.txt 'http://127.0.0.1:8765/search?q=multi-user-persistence-987654' | grep -q 'CI Docker persistence probe'
      - name: Container status
        run: docker compose ps
      - name: Stop application
        if: always()
        run: docker compose down -v

  ci-gate:
    name: aggregate CI gate
    needs: [test, sandbox-smoke, app-docker-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish aggregate status and enforce gate
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          SANDBOX_RESULT: ${{ needs.sandbox-smoke.result }}
          DOCKER_RESULT: ${{ needs.app-docker-smoke.result }}
        run: |
          state=failure
          description="One or more CI gates failed"
          if [ "$TEST_RESULT" = "success" ] && [ "$SANDBOX_RESULT" = "success" ] && [ "$DOCKER_RESULT" = "success" ]; then
            state=success
            description="Cross-platform tests, sandbox, Docker isolation and admin permissions passed"
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            curl -fsS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -d "{\"state\":\"$state\",\"context\":\"llm-learning/ci-gate\",\"description\":\"$description\"}" >/dev/null
          fi
          test "$state" = "success"
